version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: spaceintel
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: spaceintel_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
volumes:
  qdrant_storage: